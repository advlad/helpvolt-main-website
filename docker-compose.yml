services:
  # Next.js Application with Isolated Python 3 Runtime
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voltpulse_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - voltpulse_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/calculator || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Nginx High-Performance Reverse Proxy & Cache
  nginx:
    image: nginx:alpine
    container_name: voltpulse_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80" # Alternate port for dev machines where port 80 requires sudo or is busy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_started
    networks:
      - voltpulse_network

networks:
  voltpulse_network:
    driver: bridge
